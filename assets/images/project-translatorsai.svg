<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTrans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e14"/>
      <stop offset="50%" stop-color="#141420"/>
      <stop offset="100%" stop-color="#280a10"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BC0202"/>
      <stop offset="100%" stop-color="#FF1a1a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="600" height="360" fill="url(#bgTrans)"/>

  <!-- Ambient glow -->
  <circle cx="300" cy="90" r="130" fill="#38bdf8" opacity="0.1" filter="blur(40px)"/>
  <circle cx="480" cy="280" r="120" fill="#BC0202" opacity="0.14" filter="blur(40px)"/>

  <!-- App Container matching screenshot -->
  <g filter="url(#shadow)">
    <rect x="55" y="38" width="490" height="284" rx="14" fill="#111218" stroke="#282a3a" stroke-width="1.5"/>

    <!-- Header Title -->
    <text x="300" y="74" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">Translator</text>
    <text x="300" y="98" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">Indonesia - Banjar</text>
    <text x="300" y="115" text-anchor="middle" fill="#7c7f93" font-family="sans-serif" font-size="9">Neural Machine Translation (mT5) • Text, Speech &amp; Scan Foto (OCR)</text>

    <!-- Mode Tabs (Teks / Scan Foto) -->
    <rect x="215" y="128" width="80" height="24" rx="6" fill="#1d2030" stroke="#38bdf8" stroke-width="1"/>
    <text x="255" y="144" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">文A Teks</text>

    <rect x="305" y="128" width="80" height="24" rx="6" fill="#161822" stroke="#262938" stroke-width="1"/>
    <text x="345" y="144" text-anchor="middle" fill="#888ca0" font-family="sans-serif" font-size="10">📷 Scan Foto</text>

    <!-- Language Switcher Pills -->
    <rect x="195" y="162" width="90" height="22" rx="5" fill="#132238" stroke="#1e3a5f" stroke-width="1"/>
    <text x="240" y="176" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="600">Bahasa Indonesia</text>

    <text x="300" y="176" text-anchor="middle" fill="#7c7f93" font-family="sans-serif" font-size="11">⇄</text>

    <rect x="315" y="162" width="90" height="22" rx="5" fill="#2b1d14" stroke="#5c3818" stroke-width="1"/>
    <text x="360" y="176" text-anchor="middle" fill="#fb923c" font-family="sans-serif" font-size="9" font-weight="600">Bahasa Banjar</text>

    <!-- Dual Translation Panels -->
    <!-- Left Box: Bahasa Indonesia -->
    <rect x="80" y="196" width="212" height="104" rx="8" fill="#161822" stroke="#252838" stroke-width="1"/>
    <rect x="92" y="206" width="82" height="16" rx="4" fill="#132238"/>
    <circle cx="99" cy="214" r="2.5" fill="#38bdf8"/>
    <text x="106" y="217" fill="#38bdf8" font-family="sans-serif" font-size="8" font-weight="600">Bahasa Indonesia</text>
    <text x="92" y="242" fill="#e2e4f0" font-family="sans-serif" font-size="10">Belajar untuk terus melangkah</text>
    <text x="92" y="256" fill="#e2e4f0" font-family="sans-serif" font-size="10">lebih jauh</text>
    <text x="92" y="286" fill="#5e6278" font-family="sans-serif" font-size="8">🔊 Text-to-Speech</text>

    <!-- Right Box: Bahasa Banjar -->
    <rect x="308" y="196" width="212" height="104" rx="8" fill="#161822" stroke="#252838" stroke-width="1"/>
    <rect x="320" y="206" width="72" height="16" rx="4" fill="#2b1d14"/>
    <circle cx="327" cy="214" r="2.5" fill="#fb923c"/>
    <text x="334" y="217" fill="#fb923c" font-family="sans-serif" font-size="8" font-weight="600">Bahasa Banjar</text>
    <text x="320" y="242" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">Balajar gasan tarus malangkah</text>
    <text x="320" y="256" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">labih jauh</text>
    <text x="320" y="286" fill="#27c93f" font-family="sans-serif" font-size="8" font-weight="600">BLEU Score: 40.8 • FastAPI</text>
  </g>
</svg>

