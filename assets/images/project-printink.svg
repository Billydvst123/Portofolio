<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPrint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="50%" stop-color="#1f1214"/>
      <stop offset="100%" stop-color="#2d080b"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BC0202"/>
      <stop offset="100%" stop-color="#FF0000"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="600" height="360" fill="url(#bgPrint)"/>
  
  <!-- Subtle decorative grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Ambient light -->
  <circle cx="480" cy="80" r="140" fill="#BC0202" opacity="0.18" filter="blur(40px)"/>

  <!-- Mockup UI Card 1 (Backlog / Order Queue) -->
  <g filter="url(#shadow)">
    <rect x="70" y="55" width="460" height="250" rx="14" fill="#0d0d11" stroke="#33181c" stroke-width="1.5"/>
    <!-- Card Header -->
    <rect x="70" y="55" width="460" height="42" rx="14" fill="#181820"/>
    <circle cx="95" cy="76" r="5" fill="#ff5f56"/>
    <circle cx="112" cy="76" r="5" fill="#ffbd2e"/>
    <circle cx="129" cy="76" r="5" fill="#27c93f"/>
    <text x="160" y="80" fill="#a0a0b0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">PrintInk Araya • Order Dispatch Flow</text>

    <!-- Sidebar mock -->
    <rect x="90" y="115" width="90" height="12" rx="4" fill="url(#redGlow)"/>
    <rect x="90" y="138" width="70" height="8" rx="4" fill="#30303c"/>
    <rect x="90" y="154" width="80" height="8" rx="4" fill="#30303c"/>
    <rect x="90" y="170" width="60" height="8" rx="4" fill="#30303c"/>

    <!-- Order list mock columns -->
    <rect x="200" y="115" width="150" height="75" rx="8" fill="#181822" stroke="#2a1d22" stroke-width="1"/>
    <rect x="215" y="128" width="90" height="10" rx="3" fill="#ffffff" opacity="0.8"/>
    <rect x="215" y="146" width="120" height="6" rx="3" fill="#66667a"/>
    <rect x="215" y="158" width="60" height="6" rx="3" fill="#BC0202"/>
    <rect x="215" y="172" width="45" height="8" rx="4" fill="#27c93f" opacity="0.7"/>

    <rect x="365" y="115" width="145" height="75" rx="8" fill="#181822" stroke="#2a1d22" stroke-width="1"/>
    <rect x="380" y="128" width="80" height="10" rx="3" fill="#ffffff" opacity="0.8"/>
    <rect x="380" y="146" width="110" height="6" rx="3" fill="#66667a"/>
    <rect x="380" y="158" width="70" height="6" rx="3" fill="#BC0202"/>
    <rect x="380" y="172" width="55" height="8" rx="4" fill="#ffbd2e" opacity="0.8"/>

    <!-- Queue bottom bar -->
    <rect x="200" y="205" width="310" height="75" rx="8" fill="#15151e" stroke="#2d1c22" stroke-width="1"/>
    <text x="218" y="232" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Figma Backlog &amp; User Flow Architecture</text>
    <rect x="218" y="246" width="220" height="6" rx="3" fill="#757588"/>
    <rect x="218" y="258" width="160" height="6" rx="3" fill="#757588"/>
    <circle cx="485" cy="242" r="14" fill="url(#redGlow)"/>
    <polygon points="481,237 491,242 481,247" fill="#ffffff"/>
  </g>
</svg>
