<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGym" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121216"/>
      <stop offset="60%" stop-color="#1c1115"/>
      <stop offset="100%" stop-color="#2c090d"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BC0202"/>
      <stop offset="100%" stop-color="#FF2a2a"/>
    </linearGradient>
    <filter id="glowFilt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="360" fill="url(#bgGym)"/>

  <!-- Waveform grid -->
  <path d="M 0,260 Q 150,220 300,250 T 600,210" fill="none" stroke="#BC0202" stroke-width="2" opacity="0.2"/>
  <path d="M 0,280 Q 150,240 300,270 T 600,230" fill="none" stroke="#FF0000" stroke-width="1.5" opacity="0.3"/>

  <!-- UI Window -->
  <g transform="translate(60, 50)">
    <rect width="480" height="260" rx="14" fill="#0c0c10" stroke="#361a1e" stroke-width="1.5"/>
    <!-- Top Bar -->
    <rect width="480" height="38" rx="14" fill="#16161f"/>
    <circle cx="25" cy="19" r="4.5" fill="#ff5f56"/>
    <circle cx="40" cy="19" r="4.5" fill="#ffbd2e"/>
    <circle cx="55" cy="19" r="4.5" fill="#27c93f"/>
    <text x="80" y="23" fill="#9090a2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500">FitnessVals • AI Workout Telemetry Dashboard</text>

    <!-- Stat cards -->
    <rect x="25" y="55" width="135" height="60" rx="8" fill="#14141c" stroke="#2c1a1f" stroke-width="1"/>
    <text x="38" y="75" fill="#8d8da0" font-family="sans-serif" font-size="10">Active Sensors</text>
    <text x="38" y="98" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700">99.4%</text>

    <rect x="172" y="55" width="135" height="60" rx="8" fill="#14141c" stroke="#2c1a1f" stroke-width="1"/>
    <text x="185" y="75" fill="#8d8da0" font-family="sans-serif" font-size="10">AI Pose Accuracy</text>
    <text x="185" y="98" fill="#FF2a2a" font-family="sans-serif" font-size="18" font-weight="700">96.8 FPS</text>

    <rect x="320" y="55" width="135" height="60" rx="8" fill="#14141c" stroke="#2c1a1f" stroke-width="1"/>
    <text x="333" y="75" fill="#8d8da0" font-family="sans-serif" font-size="10">Telemetry Health</text>
    <text x="333" y="98" fill="#27c93f" font-family="sans-serif" font-size="18" font-weight="700">Optimal</text>

    <!-- Chart Visual -->
    <rect x="25" y="130" width="430" height="110" rx="8" fill="#12121a" stroke="#271a1e" stroke-width="1"/>
    <polyline points="45,210 90,195 140,200 190,170 240,185 290,155 340,165 390,145 435,150" fill="none" stroke="url(#redAccent)" stroke-width="3" filter="url(#glowFilt)"/>
    <circle cx="390" cy="145" r="5" fill="#FF2a2a"/>
    <circle cx="390" cy="145" r="9" fill="none" stroke="#FF2a2a" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
